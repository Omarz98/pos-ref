
name: POSREF - Test SSH Oracle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ssh:
    runs-on: ubuntu-latest

    steps:
      - name: Configurar llave SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/known_hosts

      
      - name: Validar configuracion SSH
        env:
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo "Verificando archivo known_hosts..."

          test -s ~/.ssh/known_hosts || {
            echo "ERROR: known_hosts esta vacio"
            exit 1
          }

          ssh-keygen -F "$HOST" \
            -f ~/.ssh/known_hosts >/dev/null || {
              echo "ERROR: No existe una clave para VPS_HOST"
              exit 1
            }

          echo "La clave del servidor esta registrada."

      - name: Probar conexion Oracle Cloud
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          echo "Probando conexion SSH..."

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$USER@$HOST" \
            "echo 'Conexion exitosa con Oracle'; hostname; whoami"
